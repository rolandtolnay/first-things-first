<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starter — Dark Workspace Kit</title>

<!--
  STARTER TEMPLATE — Dark Workspace Kit
  Open this file as the entry point for a new app.
  See ds/README.md for the kit cheat sheet.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="ds/tokens.css" />

<style>
  /* App-specific styles go here. Use --ds-* tokens; resist hardcoded colors. */
  .app-shell {
    position: relative;
    z-index: 1;
    padding: 24px;
    min-height: 100vh;
  }
  .app-shell .ds-window {
    max-width: 1480px;
    margin: 0 auto;
  }
  .app-body {
    padding: 48px 32px 64px;
    min-height: 540px;
    display: flex; flex-direction: column;
    gap: 24px;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- The kit. Always load components.jsx before any app code. -->
<script type="text/babel" src="ds/components.jsx"></script>

<!-- Your app. Start writing here. -->
<script type="text/babel">
  const { useState } = React;

  function App() {
    const [count, setCount] = useState(0);

    return (
      <ToastProvider>
        <div className="ds-stage">
          <div className="ds-glow" />

          <div className="app-shell">
            <div className="ds-window">
              <WindowChrome
                right={
                  <>
                    <ThemeToggle />
                    <a className="ds-mono"
                       href="design-system.html"
                       style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--ds-fg-muted)', textDecoration: 'none', padding: '6px 10px', whiteSpace: 'nowrap' }}>
                      Design system →
                    </a>
                  </>
                }
              />

              <main className="app-body">
                <SectionLabel icon="sparkle">New project</SectionLabel>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
                  <div>
                    <h1 style={{ fontSize: 36, fontWeight: 600, letterSpacing: '-0.02em', margin: '0 0 12px', lineHeight: 1.1 }}>
                      Build something quiet.<br/>
                      <span className="ds-dim">Start here.</span>
                    </h1>
                    <p style={{ color: 'var(--ds-fg-muted)', maxWidth: '52ch', lineHeight: 1.55, margin: 0 }}>
                      This is a blank canvas wired to the Dark Workspace Kit. The window shell,
                      glow, and chrome are already in place. Replace this body with your app.
                    </p>
                  </div>

                  <Card>
                    <SectionLabel icon="target" style={{ marginBottom: 16 }}>Sanity check</SectionLabel>
                    <p style={{ margin: '0 0 14px', color: 'var(--ds-fg-muted)' }}>Components & tokens are loaded.</p>
                    <div className="ds-row" style={{ gap: 8 }}>
                      <Button onClick={() => setCount(c => c + 1)}>Clicked {count}×</Button>
                      <Button variant="accent" icon="plus">Action</Button>
                    </div>
                  </Card>
                </div>

                <div className="ds-row" style={{ gap: 12, flexWrap: 'wrap' }}>
                  <Chip icon="clock" on>step 1 · tokens</Chip>
                  <Chip>step 2 · compose</Chip>
                  <Chip>step 3 · ship</Chip>
                </div>
              </main>
            </div>
          </div>
        </div>
      </ToastProvider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
